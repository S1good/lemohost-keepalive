name: Keep Server Alive

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests
      - run: python keepalive.py
        env:
          LEMO_SESSION_COOKIE: ${{ secrets.LEMO_SESSION_COOKIE }}
